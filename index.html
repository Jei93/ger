<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Industry Evolution Simulator - Edición Tycoon (ES)</title>
<style>
    /* ===== Estilos principales (responsive + pulido) ===== */
    :root{
        --bg:#0b0b12; --panel:#121217; --card:#1b1b20; --accent:#00b8ff;
        --good:#00ff41; --warn:#ffcc00; --danger:#ff4d6d; --muted:#9aa0a6;
        --border:#444;
        font-synthesis:none;
    }
    *{box-sizing:border-box}
    html,body{height:100%; margin:0; font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:linear-gradient(180deg,#070617 0%, #0f0519 100%); color:#e8eef6;}
    #gameCanvas{position:absolute; inset:0; width:100%; height:100%; display:block; z-index:0; background:linear-gradient(180deg,#081026 0%, rgba(0,0,0,0.0) 40%);}
    .ui-overlay{position:relative; z-index:10; display:grid; grid-template-columns:240px 1fr 260px; grid-template-rows: auto 1fr auto; gap:12px; padding:12px; height:100vh; pointer-events:none;}
    @media (max-width:900px){ .ui-overlay{ grid-template-columns:1fr; grid-template-rows:auto auto 1fr auto; padding:8px; } .left-panel,.right-panel{ width:100%; } }
    .panel{ background:linear-gradient(180deg,var(--panel),#0f1218); border:2px solid var(--border); padding:10px; border-radius:8px; pointer-events:all; box-shadow:0 6px 20px rgba(0,0,0,0.6); }
    .left-panel{ grid-column:1; grid-row:1 / span 3; display:flex; flex-direction:column; gap:10px; min-height:0; overflow:auto;}
    .center-panel{ grid-column:2; grid-row:1; display:flex; gap:10px; align-items:center; justify-content:center; }
    .middle-big{ grid-column:2; grid-row:2; min-height:0; overflow:auto; padding:12px; display:flex; flex-direction:column; gap:12px; }
    .right-panel{ grid-column:3; grid-row:1 / span 3; display:flex; flex-direction:column; gap:10px; min-height:0; overflow:auto; }
    .bottom-panel{ grid-column:1 / span 3; grid-row:3; display:flex; gap:8px; align-items:center; justify-content:center; }

    .title{ font-weight:700; color:var(--accent); letter-spacing:1px; font-size:13px; text-transform:uppercase; display:flex; justify-content:space-between; align-items:center; }
    .stat-row{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); margin-top:6px; }
    .bar{ height:10px; background:rgba(255,255,255,0.04); border-radius:6px; overflow:hidden; border:1px solid rgba(255,255,255,0.03); }
    .fill{ height:100%; width:0%; transition:width .6s ease; }
    .btn{ display:inline-block; padding:8px 12px; background:linear-gradient(180deg,#14151a,#0f1116); border:1px solid var(--border); color:#e8eef6; border-radius:6px; cursor:pointer; font-weight:700; font-size:13px; text-transform:uppercase; }
    .btn.primary{ border-color:var(--accent); box-shadow:0 6px 18px rgba(0,184,255,0.08); }
    .btn.danger{ border-color:var(--danger); }
    .btn.block{ width:100%; text-align:center; }

    /* Employee list */
    .employee-card{ background:linear-gradient(180deg,#111218,#0f1216); padding:8px; border-radius:6px; border:1px solid rgba(255,255,255,0.03); margin-bottom:8px; display:flex; gap:10px; align-items:center; }
    .emp-avatar{ width:46px; height:46px; border-radius:6px; background:linear-gradient(90deg,#2b2b2b,#1b1b1b); display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:14px; }
    .emp-meta{ flex:1; display:flex; flex-direction:column; gap:6px; }
    .emp-name{ font-weight:700; font-size:13px; }
    .emp-small{ font-size:11px; color:var(--muted); }
    .stat-bars{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .stat-mini{ font-size:10px; color:var(--muted); width:100%; display:flex; gap:6px; align-items:center; }
    .bar-mini{ flex:1; height:8px; background:rgba(255,255,255,0.04); border-radius:5px; overflow:hidden; }
    .bar-mini .fill{ height:100%; width:0; transition:width .4s linear; }

    /* Modales */
    .modal{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:2200; background:rgba(2,2,6,0.6); padding:16px; }
    .modal.active{ display:flex; }
    .modal-box{ width:100%; max-width:900px; max-height:90vh; overflow:auto; background:linear-gradient(180deg,#101217,#0b0b10); border:2px solid var(--accent); padding:14px; border-radius:8px; }
    .selection-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    @media (max-width:900px){ .selection-grid{ grid-template-columns:repeat(2,1fr); } }

    /* Event log + notifications */
    #eventLog{ position:fixed; left:12px; bottom:120px; width:320px; max-height:300px; overflow:auto; z-index:2000; pointer-events:none; font-size:12px; }
    .event-item{ background:rgba(0,0,0,0.45); border-left:4px solid var(--accent); padding:8px; margin-bottom:6px; border-radius:6px; color:var(--muted); }
    .notif{ position:fixed; right:18px; top:18px; z-index:3000; background:linear-gradient(180deg,#0a0f18,#061023); border:2px solid var(--accent); padding:10px 12px; border-radius:8px; display:none; }
    .notif.show{ display:block; }

    /* Review modal & lists */
    .review-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media (max-width:900px){ .review-grid{ grid-template-columns:1fr; } }

    /* Achievement popup */
    .ach{ position:fixed; left:50%; top:40%; transform:translateX(-50%); padding:12px 16px; background:linear-gradient(90deg,#2b0036,#6b0072); color:white; border-radius:10px; z-index:4000; display:none; }
    .ach.show{ display:block; }

    /* Small helpers */
    .muted{ color:var(--muted); font-size:12px; }
    .small{ font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div class="ui-overlay">
    <div class="panel left-panel">
        <div class="title">RECURSOS <span id="uiYear">2000-01</span></div>

        <div class="stat-row"><div class="small">Caja</div><div id="uiCash" class="small">$500K</div></div>
        <div class="bar"><div id="cashFill" class="fill" style="width:20%;background:linear-gradient(90deg,var(--good),#00cc33)"></div></div>

        <div class="stat-row"><div class="small">Equipo</div><div id="uiTeam" class="small">3 / 50</div></div>
        <div class="bar"><div id="teamFill" class="fill" style="width:6%;background:linear-gradient(90deg,var(--accent),#0077cc)"></div></div>

        <div class="stat-row"><div class="small">Reputación</div><div id="uiRep" class="small">65%</div></div>
        <div class="bar"><div id="repFill" class="fill" style="width:65%;background:linear-gradient(90deg,var(--warn),#ffb400)"></div></div>

        <div class="stat-row"><div class="small">Hype</div><div id="uiHype" class="small">30%</div></div>
        <div class="bar"><div id="hypeFill" class="fill" style="width:30%;background:linear-gradient(90deg,#9b59ff,#6a0fb5)"></div></div>

        <div style="height:8px"></div>

        <button class="btn block primary" onclick="game.abrirContratacion()">CONTRATAR</button>
        <button class="btn block" onclick="game.invertirMarketing()">MARKETING</button>
        <button class="btn block" onclick="game.entrenarEquipo()">CAPACITAR EQUIPO</button>
        <button class="btn block" onclick="game.moverOficina()">MEJORAR OFICINA</button>
        <button class="btn block danger" onclick="game.reiniciarJuego()">NUEVO JUEGO</button>
    </div>

    <div class="center-panel panel">
        <div style="width:100%;">
            <div class="title">PROYECTO ACTIVO <span id="projectMonths" class="small"></span></div>
            <div style="margin-top:8px;">
                <div id="activeProjectInfo">
                    <div class="stat-row"><div id="projectName" class="small">Ninguno</div><div id="projectProgressText" class="small">0%</div></div>
                    <div class="bar"><div id="projectProgress" class="fill" style="width:0%; background:linear-gradient(90deg,#9b59ff,#6a0fb5)"></div></div>
                    <div id="projectStats" style="margin-top:8px; display:flex; gap:10px; flex-wrap:wrap;"></div>
                </div>
            </div>

            <div style="margin-top:12px; display:flex; gap:8px; align-items:center;">
                <button class="btn primary" onclick="game.iniciarProyecto()">NUEVO PROYECTO</button>
                <button class="btn" onclick="game.continuarMes()">CONTINUAR (1 mes)</button>
                <button class="btn" id="autoplayBtn" onclick="game.toggleAutoplay()">AUTO: OFF</button>
                <div style="flex:1"></div>
                <div class="small">Crunch: <span id="crunchStatus">OFF</span></div>
            </div>
        </div>
    </div>

    <div class="right-panel panel">
        <div class="title">EQUIPO</div>
        <div id="employeeList" style="margin-top:8px;"></div>
    </div>

    <div class="bottom-panel panel">
        <div style="display:flex; gap:8px; width:100%; align-items:center;">
            <button class="btn" onclick="game.contratoRapido()">TRABAJO POR ENCARGO</button>
            <div style="flex:1"></div>
            <div class="small muted">Pulse 'CONTINUAR' para avanzar 1 mes. El juego avanza también automáticamente si AUTO está activado.</div>
        </div>
    </div>
</div>

<!-- Modal Contratación -->
<div class="modal" id="hireModal">
    <div class="modal-box">
        <div class="title">CANDIDATOS DISPONIBLES <span id="hireInfo" class="small"></span></div>
        <div id="hireGrid" style="margin-top:12px" class="selection-grid"></div>
        <div style="margin-top:12px; display:flex; gap:8px; justify-content:flex-end;">
            <button class="btn" onclick="document.getElementById('hireModal').classList.remove('active')">CERRAR</button>
        </div>
    </div>
</div>

<!-- Review modal -->
<div class="modal" id="reviewModal">
    <div class="modal-box">
        <div class="title">RESEÑA DEL JUEGO <span id="reviewName" class="small"></span></div>
        <div style="margin-top:12px;" id="reviewContent"></div>
        <div style="margin-top:12px; display:flex; gap:8px; justify-content:flex-end;">
            <button class="btn" onclick="document.getElementById('reviewModal').classList.remove('active')">CONTINUAR</button>
        </div>
    </div>
</div>

<div id="eventLog" style="z-index:2100;"></div>
<div id="notif" class="notif"></div>
<div id="ach" class="ach"></div>

<script>
/* ======= Lógica del juego (versión adaptada en español) ======= */

class JuegoTycoon {
    constructor(){
        // DOM
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');

        // Estado base
        this.estado = {
            año:2000, mes:1,
            caja: 500000,
            equipo:0,
            maxEquipo:50,
            reputacion:65,
            hype:30,
            moral:75,
            proyectoActivo: null,
            juegos: [],
            empleados: [],
            ingresosTotales:0,
            nivelOficina:1,
            autoplay:false,
            crunch:false
        };

        // Configurables
        this.config = {
            tickMs: 2200,        // cada tick = 1 mes (ajustable)
            maxAssigned: 8,
            basePayrollIntervalMonths: 1
        };

        // Internos
        this.tickHandle = null;
        this.initCanvas();
        this.iniciarMiembrosIniciales();
        this.bindUI();
        this.empezarTicks();
        this.actualizarUI();
    }

    initCanvas(){
        this.resize();
        window.addEventListener('resize', ()=>this.resize());
        this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
    }
    resize(){
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }

    bindUI(){
        window.game = this; // compatibilidad global
        // close modal click outside
        document.getElementById('hireModal').addEventListener('click', (e)=>{
            if (e.target === document.getElementById('hireModal')) document.getElementById('hireModal').classList.remove('active');
        });
        document.getElementById('reviewModal').addEventListener('click', (e)=>{
            if (e.target === document.getElementById('reviewModal')) document.getElementById('reviewModal').classList.remove('active');
        });
    }

    iniciarMiembrosIniciales(){
        // crea 3 empleados iniciales coherentes
        const n1 = new Empleado("Alex Dev", this);
        const n2 = new Empleado("Sam Artist", this);
        const n3 = new Empleado("Jordan Designer", this);
        this.estado.empleados.push(n1,n2,n3);
        this.estado.equipo = this.estado.empleados.length;
    }

    empezarTicks(){
        if (this.tickHandle) clearInterval(this.tickHandle);
        this.tickHandle = setInterval(()=>this.tick(), this.config.tickMs);
    }

    toggleAutoplay(){
        this.estado.autoplay = !this.estado.autoplay;
        document.getElementById('autoplayBtn').textContent = this.estado.autoplay ? 'AUTO: ON' : 'AUTO: OFF';
    }

    // Avanza exactamente 1 mes: payroll + desarrollo + UI
    tick(){
        // Avanza el mes
        this.estado.mes++;
        if (this.estado.mes > 12){ this.estado.mes = 1; this.estado.año++; }
        // Pago de nóminas cada mes
        this.pagarNominas();
        // Desarrollo automático si hay proyecto
        if (this.estado.proyectoActivo) {
            this.desarrollarMes();
        }
        // Si autoplay activado, el tick ya avanza; si no, tick sigue corriendo pero no desarrolla si autoplay=false.
        // Actualiza UI
        this.actualizarUI();
    }

    // CONTINUAR (1 mes) -> forzar 1 mes (usa la misma lógica que tick pero sin esperar)
    continuarMes(){
        // Forzamos exactamente una iteración de mes (útil si autoplay off)
        this.tick();
    }

    pagarNominas(){
        // salarios mensuales sumados
        const total = this.estado.empleados.reduce((s,e)=> s + (e.salarioMensual||0), 0);
        if (total <= 0) return;
        if (this.estado.caja >= total){
            this.estado.caja -= total;
            this.log(`Se han pagado las nóminas: $${total.toLocaleString()}`);
            // leve subida moral
            this.estado.empleados.forEach(e => e.moral = Math.min(100, e.moral + 0.8));
        } else {
            // Si no hay dinero suficiente -> efecto negativo
            this.log(`Error: fondos insuficientes para nóminas ($${total.toLocaleString()})`, 'danger');
            this.estado.reputacion = Math.max(0, this.estado.reputacion - 3);
            this.estado.empleados.forEach(e => e.moral = Math.max(0, e.moral - 8));
            // intentar pago parcial proporcional
            const available = this.estado.caja;
            if (available > 0){
                const ratio = available / total;
                this.estado.empleados.forEach(e => {
                    const pago = Math.floor(e.salarioMensual * ratio);
                    // no restamos cada pago por separado (ya restamos todo junto)
                });
                this.estado.caja = 0;
            }
        }
    }

    // Contratación: abre modal con 3 candidatos
    abrirContratacion(){
        const grid = document.getElementById('hireGrid');
        grid.innerHTML = '';
        const candidatos = [];
        for (let i=0;i<3;i++) candidatos.push(this.generarCandidato());
        candidatos.forEach((c, idx) => {
            const div = document.createElement('div');
            div.className = 'selection-tile';
            div.style.background = 'linear-gradient(180deg,#0f1318,#0b0f14)';
            div.style.padding = '10px';
            div.style.border = '1px solid rgba(255,255,255,0.03)';
            div.style.borderRadius = '8px';
            div.innerHTML = `<div style="font-weight:700">${c.nombre} — <span style="color:var(--muted); font-weight:600">${c.rol}</span></div>
                <div style="font-size:12px; color:var(--muted); margin-top:6px;">Sueld mensual: $${c.salario}</div>
                <div style="margin-top:6px; font-size:12px;">
                    <div style="font-size:11px; color:var(--muted)">Coding</div>
                    <div class="bar-mini" style="margin-top:4px"><div class="fill" style="width:${c.skills.coding}% ; background:linear-gradient(90deg,#00b8ff,#0088cc)"></div></div>
                    <div style="height:6px"></div>
                    <div style="display:flex; gap:6px; margin-top:6px;">
                        <button class="btn" id="hireBtn${idx}">Contratar</button>
                        <button class="btn" id="rejectBtn${idx}">Rechazar</button>
                    </div>
                </div>`;
            grid.appendChild(div);
            document.getElementById(`hireBtn${idx}`).addEventListener('click', ()=> {
                this.firmarCandidato(c);
                document.getElementById('hireModal').classList.remove('active');
            });
            document.getElementById(`rejectBtn${idx}`).addEventListener('click', ()=> {
                div.style.opacity = 0.45;
                div.querySelectorAll('button').forEach(b=> b.disabled=true);
            });
        });
        document.getElementById('hireModal').classList.add('active');
    }

    generarCandidato(){
        const nombres = ['Alex','Sam','Jordan','Taylor','Morgan','Casey','Riley','Avery','Drew','Kai','Fran','Luis','Marta'];
        const roles = ['Programador','Artista','Diseñador','QA','Productor','Generalista'];
        const rol = roles[Math.floor(Math.random()*roles.length)];
        const skills = {
            coding: this.rand(30,90),
            design: this.rand(20,90),
            art: this.rand(10,95),
            qa: this.rand(20,95)
        };
        // sueldo mensual en rango razonable
        const sum = skills.coding + skills.design + skills.art + skills.qa;
        const salario = Math.max(1200, Math.floor(sum * 7)); // escala sensata
        return {
            nombre: nombres[Math.floor(Math.random()*nombres.length)] + ' ' + rol.slice(0,3),
            rol,
            skills,
            salario
        };
    }

    firmarCandidato(info){
        // coste de firma (1 mes de salario como retainer)
        const costeFirma = Math.floor(info.salario);
        if (this.estado.caja < costeFirma){
            this.notificar('FONDOS INSUFICIENTES', 'No tienes dinero para fichar a este candidato.');
            return;
        }
        this.estado.caja -= costeFirma;
        const emp = new Empleado(info.nombre, this);
        emp.role = info.rol;
        emp.coding = info.skills.coding;
        emp.design = info.skills.design;
        emp.art = info.skills.art;
        emp.qa = info.skills.qa;
        emp.salarioMensual = info.salario;
        this.estado.empleados.push(emp);
        this.estado.equipo = this.estado.empleados.length;
        this.log(`Contratado: ${emp.nombre} — ${emp.role}`);
        this.notificar('CONTRATADO', `${emp.nombre} ha sido contratado. Firma: $${costeFirma}`);
        this.actualizarUI();
    }

    // Trabajo por encargo (contrato rápido) -> cantidades sensatas + cooldown simple
    contratoRapido(){
        // El pago depende del tamaño del equipo y reputación, no es insultantemente alto
        const base = 15000;
        const factorEquipo = Math.max(1, this.estado.equipo * 0.15);
        const bonoRep = 1 + (this.estado.reputacion/200);
        const pago = Math.floor(base * factorEquipo * bonoRep);
        this.estado.caja += pago;
        this.estado.ingresosTotales += pago;
        this.estado.moral = Math.max(0, this.estado.moral - 3);
        this.log(`Trabajo por encargo completado: +$${pago.toLocaleString()}`);
        this.actualizarUI();
    }

    invertirMarketing(){
        const coste = 25000;
        if (this.estado.caja < coste){ this.notificar('SIN FONDOS', 'No tienes suficiente caja para marketing.'); return; }
        this.estado.caja -= coste;
        this.estado.hype = Math.min(100, this.estado.hype + 20);
        this.log('Campaña de marketing: hype aumentado.');
        this.actualizarUI();
    }

    entrenarEquipo(){
        const coste = 60000;
        if (this.estado.caja < coste){ this.notificar('SIN FONDOS','No hay fondos para formación.'); return; }
        this.estado.caja -= coste;
        // mejora pequeña en habilidades
        this.estado.empleados.forEach(e => {
            e.coding = Math.min(100, e.coding + this.rand(2,6));
            e.design = Math.min(100, e.design + this.rand(2,6));
            e.art = Math.min(100, e.art + this.rand(2,6));
            e.qa = Math.min(100, e.qa + this.rand(2,6));
            e.moral = Math.min(100, e.moral + 3);
        });
        this.log('Formación completada: habilidades del equipo mejoradas.');
        this.actualizarUI();
    }

    moverOficina(){
        const coste = 120000;
        if (this.estado.caja < coste || this.estado.nivelOficina >= 5){ this.notificar('No disponible','No puedes mejorar la oficina ahora.'); return; }
        this.estado.caja -= coste;
        this.estado.nivelOficina++;
        this.estado.maxEquipo += 15;
        this.estado.moral = Math.min(100, this.estado.moral + 8);
        this.log('Oficina mejorada: más capacidad y moral.');
        this.actualizarUI();
    }

    reiniciarJuego(){
        if (!confirm('¿Empezar una partida nueva? Se perderá el progreso actual.')) return;
        localStorage.removeItem('tycoon_save_es');
        location.reload();
    }

    // Crear nuevo proyecto (modal simple integrado en prompt para rapidez)
    iniciarProyecto(){
        // pedimos datos básicos con inputs nativos simples (podemos mejorar UI luego)
        const genero = prompt('Género (accion, rpg, estrategia, puzzle, terror, simulacion):','accion');
        if (!genero) return;
        const tema = prompt('Tema (espacial, medieval, cyberpunk, fantasia, zombies, deportes):','espacial');
        if (!tema) return;
        const plataforma = prompt('Plataforma (pc, consola, movil, vr):','pc');
        if (!plataforma) return;
        const presupuesto = parseInt(prompt('Presupuesto en $ (ej. 80000):','150000'));
        if (isNaN(presupuesto) || presupuesto < 10000){ this.notificar('ERROR','Presupuesto inválido'); return; }
        if (this.estado.caja < presupuesto){ this.notificar('SIN FONDOS','No tienes suficiente dinero para financiar el proyecto'); return; }
        this.estado.caja -= presupuesto;
        this.estado.proyectoActivo = {
            genero, tema, plataforma,
            presupuesto,
            progreso:0,
            calidad:10,
            mesesDesarrollo:0,
            assigned: []
        };
        this.log(`Proyecto iniciado: ${genero} / ${tema} en ${plataforma}`);
        this.actualizarUI();
    }

    // Asignación automática: elige hasta maxAssigned empleados mejor adaptados
    autoAsignar(proy){
        const pool = this.estado.empleados.slice();
        // score por empleado en relación al genero
        pool.sort((a,b) => this.puntuacionEmpleadoParaProyecto(b,proy) - this.puntuacionEmpleadoParaProyecto(a,proy));
        const asignados = pool.slice(0, Math.min(this.config.maxAssigned, pool.length));
        proy.assigned = asignados.map(e => e.id);
        return proy.assigned;
    }

    puntuacionEmpleadoParaProyecto(emp, proy){
        // heurística simple: diferentes pesos por género
        let w = {coding:0.25, design:0.25, art:0.25, qa:0.25};
        if (proy.genero==='accion') w = {coding:0.45, design:0.2, art:0.15, qa:0.2};
        if (proy.genero==='rpg') w = {design:0.35, art:0.3, coding:0.2, qa:0.15};
        if (proy.genero==='terror') w = {art:0.4, design:0.3, coding:0.15, qa:0.15};
        if (proy.genero==='simulacion') w = {coding:0.4, qa:0.3, design:0.2, art:0.1};
        const score = emp.coding*w.coding + emp.design*w.design + emp.art*w.art + emp.qa*w.qa;
        return score * (emp.moral/100) * (1 + (emp.level-1)*0.05);
    }

    // Desarrollo: un mes de trabajo -> añadir progreso y calidad según contribuciones de empleados
    desarrollarMes(){
        const p = this.estado.proyectoActivo;
        if (!p) return;
        p.mesesDesarrollo++;
        // asignar si no hay nadie
        if (!p.assigned || p.assigned.length===0) this.autoAsignar(p);

        // calcular contribuciones por empleado
        let progresoTotal = 0;
        let calidadTotal = 0;
        p.assigned.forEach(id => {
            const emp = this.estado.empleados.find(e => e.id===id);
            if (!emp) return;
            // cada role aporta distinto:
            // Programador -> progreso (coding), Designer/Artist -> calidad, QA -> reduce bugs (mejora calidad)
            const cod = emp.coding/100;
            const des = emp.design/100;
            const art = emp.art/100;
            const qa  = emp.qa/100;
            // productividad y moral
            const prodFactor = (emp.productivity/100) * (emp.moral/100);
            // contribuciones mensuales: escala con presupuesto/nivel
            const aporteProgreso = (cod*0.6 + des*0.15 + art*0.1 + qa*0.15) * prodFactor * (10 + Math.min(40, p.presupuesto/50000));
            const aporteCalidad  = (art*0.45 + des*0.35 + qa*0.2) * prodFactor * 1.5;
            progresoTotal += aporteProgreso;
            calidadTotal += aporteCalidad;
            // experiencia y leve subida de moral si no hay crunch
            emp.exp += Math.floor(aporteProgreso/3);
            if (!this.estado.crunch) emp.moral = Math.min(100, emp.moral + 0.5);
            else emp.moral = Math.max(0, emp.moral - 1.5);
            // animación de trabajo: estado 'trabajando' con probabilidad
            emp.estado = 'trabajando';
        });

        // aplicar progreso y calidad
        // normalizamos para que 100 sea alcanzable en 6-18 meses dependiendo presupuesto/equipo
        p.progreso += progresoTotal * 0.4; // escala conservadora
        p.calidad += calidadTotal * 0.08;  // calidad se acumula lentamente
        // añadir pequeñas fluctuaciones
        p.calidad = Math.min(100, p.calidad + (Math.random()*2 - 1));

        // control de progreso >100 => publicar
        if (p.progreso >= 100) this.publicarJuego();
        else this.log(`Proyecto ${p.genero}: +${Math.round(progresoTotal*0.4)}% progreso (mes ${p.mesesDesarrollo})`);
    }

    publicarJuego(){
        const p = this.estado.proyectoActivo;
        if (!p) return;
        // calcular nota final combinando calidad, reputación, hype y presupuesto
        let nota = 50;
        nota += (p.calidad * 0.4);
        nota += (this.estado.reputacion * 0.2);
        nota += (this.estado.hype * 0.1);
        nota += Math.min(15, (p.presupuesto / 100000) * 10);
        // factor equipo/skills
        if (p.assigned && p.assigned.length>0){
            const avgSkill = p.assigned.reduce((s,id)=>{
                const e = this.estado.empleados.find(x=>x.id===id);
                return s + ((e.coding + e.design + e.art + e.qa)/4);
            },0) / p.assigned.length;
            nota += (avgSkill/100) * 10;
        }
        nota *= (0.95 + Math.random()*0.1); // variación
        nota = Math.min(100, Math.max(20, Math.round(nota*10)/10));

        // ventas: ya no es absurdo. Ventas dependen de nota, hype, plataforma y budget
        // baseVentas = presupuesto * 1.5, modificado por nota
        const baseVentas = p.presupuesto * 1.3;
        const factorNota = 1 + ((nota - 50)/100); // si nota=100 => factor 1.5
        const factorHype = 1 + (this.estado.hype/200);
        const ventas = Math.floor(baseVentas * factorNota * factorHype);

        // Efectos globales
        this.estado.caja += ventas;
        this.estado.ingresosTotales += ventas;
        this.estado.reputacion = Math.min(100, this.estado.reputacion + (nota>=80 ? 8 : nota>=65 ? 3 : -4));
        this.estado.hype = Math.max(0, this.estado.hype - 20);
        this.estado.moral = Math.min(100, this.estado.moral + 6);

        // guardar juego publicado
        this.estado.juegos.push({
            genero: p.genero, tema: p.tema, plataforma: p.plataforma,
            presupuesto: p.presupuesto, meses: p.mesesDesarrollo, nota, ventas
        });

        // mostrar modal de reseñas
        this.mostrarResena(p, nota, ventas);

        this.log(`Publicado: ${p.genero} — Nota: ${nota} — Ventas: $${ventas.toLocaleString()}`);
        // limpiar proyecto activo
        this.estado.proyectoActivo = null;
        this.actualizarUI();
        this.comprobarLogros();
    }

    mostrarResena(proy, nota, ventas){
        const modal = document.getElementById('reviewModal');
        const content = document.getElementById('reviewContent');
        content.innerHTML = `
            <div style="display:flex; gap:12px; align-items:center;">
                <div style="flex:1">
                    <div style="font-weight:800; font-size:18px">${this.tituloReadable(proy)}</div>
                    <div class="small muted">Meses de desarrollo: ${proy.mesesDesarrollo} — Presupuesto: $${proy.presupuesto.toLocaleString()}</div>
                    <div style="height:10px"></div>
                    <div style="font-weight:700; font-size:22px">${nota}/100</div>
                    <div class="small muted" style="margin-top:6px">Ventas estimadas: $${ventas.toLocaleString()}</div>
                </div>
                <div style="width:300px;">
                    <div class="small muted">Asignados al lanzamiento:</div>
                    <div style="margin-top:8px;">
                        ${ (proy.assigned && proy.assigned.length>0) ? proy.assigned.map(id=>{
                            const e = this.estado.empleados.find(x=>x.id===id);
                            return `<div style="font-size:13px; margin-bottom:6px;">${e ? e.nombre : 'Desconocido' } — Lvl${e ? e.level : 1}</div>`;
                        }).join('') : '<div class="small muted">Nadie asignado</div>'}
                    </div>
                </div>
            </div>
            <div style="margin-top:12px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px;">
                <div style="background:var(--card); padding:8px; border-radius:6px;"><div class="small muted">Calidad</div><div style="font-weight:800">${Math.round(proy.calidad)}</div></div>
                <div style="background:var(--card); padding:8px; border-radius:6px;"><div class="small muted">Meses</div><div style="font-weight:800">${proy.mesesDesarrollo}</div></div>
                <div style="background:var(--card); padding:8px; border-radius:6px;"><div class="small muted">Presupuesto</div><div style="font-weight:800">$${proy.presupuesto.toLocaleString()}</div></div>
            </div>
        `;
        modal.classList.add('active');
    }

    tituloReadable(proy){
        return `${proy.genero.toUpperCase()} • ${proy.tema}`;
    }

    // UI helpers
    actualizarUI(){
        document.getElementById('uiYear').textContent = `${this.estado.año}-${String(this.estado.mes).padStart(2,'0')}`;
        document.getElementById('uiCash').textContent = `$${Math.round(this.estado.caja/1000)}K`;
        document.getElementById('uiTeam').textContent = `${this.estado.equipo} / ${this.estado.maxEquipo}`;
        document.getElementById('uiRep').textContent = `${Math.round(this.estado.reputacion)}%`;
        document.getElementById('uiHype').textContent = `${Math.round(this.estado.hype)}%`;

        document.getElementById('cashFill').style.width = `${Math.min(100, (this.estado.caja/5000))}%`;
        document.getElementById('teamFill').style.width = `${(this.estado.equipo/this.estado.maxEquipo)*100}%`;
        document.getElementById('repFill').style.width = `${this.estado.reputacion}%`;
        document.getElementById('hypeFill').style.width = `${this.estado.hype}%`;

        // Proyecto
        const pPanel = document.getElementById('projectName');
        const progBar = document.getElementById('projectProgress');
        const progText = document.getElementById('projectProgressText');
        const stats = document.getElementById('projectStats');
        if (this.estado.proyectoActivo){
            const p = this.estado.proyectoActivo;
            pPanel.textContent = `${p.genero.toUpperCase()} • ${p.tema}`;
            progBar.style.width = `${Math.min(100, p.progreso)}%`;
            progText.textContent = `${Math.min(100, Math.floor(p.progreso))}%`;
            document.getElementById('projectMonths').textContent = `Meses: ${p.mesesDesarrollo}`;
            stats.innerHTML = `<div class="small muted">Asignados: ${p.assigned ? p.assigned.length : 0}</div>
                               <div class="small muted">Calidad: ${Math.round(p.calidad)}</div>
                               <div class="small muted">Presupuesto: $${p.presupuesto.toLocaleString()}</div>`;
        } else {
            pPanel.textContent = 'Ninguno';
            progBar.style.width = '0%';
            progText.textContent = '0%';
            stats.innerHTML = '';
            document.getElementById('projectMonths').textContent = '';
        }

        // Lista empleados
        const container = document.getElementById('employeeList');
        container.innerHTML = '';
        this.estado.empleados.forEach(emp => {
            const card = document.createElement('div');
            card.className = 'employee-card';
            const avatar = document.createElement('div'); avatar.className = 'emp-avatar'; avatar.textContent = emp.nombre.split(' ')[0].slice(0,2).toUpperCase();
            const meta = document.createElement('div'); meta.className = 'emp-meta';
            const row1 = document.createElement('div'); row1.className = 'emp-name'; row1.textContent = `${emp.nombre} • ${emp.role || 'General'}`;
            const row2 = document.createElement('div'); row2.className = 'emp-small'; row2.textContent = `Lvl ${emp.level} • $${emp.salarioMensual}/mes • Moral ${Math.round(emp.moral)}%`
            const bars = document.createElement('div'); bars.className = 'stat-bars';
            // stat mini rows
            const sCoding = this.createStatMini('Prog', emp.coding, '#00b8ff');
            const sDesign = this.createStatMini('Diseño', emp.design, '#9b59ff');
            const sArt = this.createStatMini('Arte', emp.art, '#ff66b2');
            const sQA = this.createStatMini('QA', emp.qa, '#ffd166');
            bars.appendChild(sCoding); bars.appendChild(sDesign); bars.appendChild(sArt); bars.appendChild(sQA);

            meta.appendChild(row1); meta.appendChild(row2); meta.appendChild(bars);

            const actions = document.createElement('div');
            const viewBtn = document.createElement('button'); viewBtn.className='btn'; viewBtn.textContent='VER';
            viewBtn.addEventListener('click', ()=> this.abrirPanelEmpleado(emp));
            actions.appendChild(viewBtn);

            card.appendChild(avatar); card.appendChild(meta); card.appendChild(actions);
            container.appendChild(card);
        });

        // Guardado automático (cada vez que actualizamos por tick)
        this.autoguardar();
    }

    createStatMini(label, value, color){
        const wrap = document.createElement('div');
        wrap.className = 'stat-mini';
        const lbl = document.createElement('div'); lbl.style.width='48px'; lbl.style.fontSize='11px'; lbl.style.color='var(--muted)'; lbl.textContent = label;
        const barc = document.createElement('div'); barc.className = 'bar-mini';
        const fill = document.createElement('div'); fill.className = 'fill'; fill.style.width = `${value}%`; fill.style.background = `linear-gradient(90deg, ${color}, #222)`;
        barc.appendChild(fill);
        wrap.appendChild(lbl); wrap.appendChild(barc);
        return wrap;
    }

    abrirPanelEmpleado(emp){
        // Modal con acciones: entrenar, promocionar, despedir
        const modal = document.createElement('div');
        modal.className = 'modal active';
        modal.style.zIndex = 3000;
        const box = document.createElement('div'); box.className='modal-box';
        box.innerHTML = `<div class="title">${emp.nombre} — ${emp.role || 'General'}</div>
            <div style="display:flex; gap:8px; margin-top:8px;">
                <div style="flex:1;">
                    <div class="small muted">Nivel</div><div style="font-weight:800">${emp.level}</div>
                    <div style="height:8px"></div>
                    <div class="small muted">Experiencia</div><div style="font-weight:700">${emp.exp}</div>
                </div>
                <div style="flex:1;">
                    <div class="small muted">Sueldo</div><div style="font-weight:800">$${emp.salarioMensual}/mes</div>
                    <div style="height:8px"></div>
                    <div class="small muted">Moral</div><div style="font-weight:700">${Math.round(emp.moral)}%</div>
                </div>
            </div>
            <div style="margin-top:12px; display:flex; gap:8px;">
                <button class="btn" id="trainEmp">Entrenar ($8000)</button>
                <button class="btn" id="promoteEmp">Promocionar</button>
                <button class="btn danger" id="fireEmp">Despedir</button>
                <button class="btn" id="closeEmp">Cerrar</button>
            </div>`;
        modal.appendChild(box);
        document.body.appendChild(modal);

        box.querySelector('#closeEmp').addEventListener('click', ()=> document.body.removeChild(modal));
        box.querySelector('#trainEmp').addEventListener('click', ()=>{
            if (this.estado.caja < 8000) { this.notificar('SIN FONDOS','No hay dinero para entrenar.'); return; }
            this.estado.caja -= 8000;
            emp.coding = Math.min(100, emp.coding + this.rand(3,7));
            emp.design = Math.min(100, emp.design + this.rand(3,7));
            emp.art = Math.min(100, emp.art + this.rand(3,7));
            emp.qa = Math.min(100, emp.qa + this.rand(3,7));
            emp.moral = Math.min(100, emp.moral + 5);
            this.log(`${emp.nombre} ha recibido entrenamiento.`);
            this.actualizarUI();
        });
        box.querySelector('#promoteEmp').addEventListener('click', ()=>{
            if (emp.exp < 100){ this.notificar('INFO','Necesita 100 de experiencia para promocionar'); return; }
            emp.level++; emp.exp -= 100; emp.salarioMensual = Math.floor(emp.salarioMensual * 1.2); emp.productivity = Math.min(200, emp.productivity + 10);
            this.log(`${emp.nombre} promocionado a nivel ${emp.level}`);
            this.actualizarUI();
        });
        box.querySelector('#fireEmp').addEventListener('click', ()=>{
            if (!confirm(`¿Despedir a ${emp.nombre}?`)) return;
            this.estado.empleados = this.estado.empleados.filter(e => e.id !== emp.id);
            this.estado.equipo = this.estado.empleados.length;
            this.log(`Despedido: ${emp.nombre}`);
            document.body.removeChild(modal);
            this.actualizarUI();
        });
    }

    // Guardado y carga simple
    autoguardar(){
        try {
            const data = {
                estado: this.estado,
                empleados: this.estado.empleados.map(e => ({
                    id:e.id, nombre:e.nombre, role:e.role, coding:e.coding, design:e.design, art:e.art, qa:e.qa, salarioMensual:e.salarioMensual, moral:e.moral, level:e.level, exp:e.exp, productivity:e.productivity
                }))
            };
            localStorage.setItem('tycoon_save_es', JSON.stringify(data));
        } catch(e){ console.warn('No se pudo guardar', e); }
    }
    cargarJuego(){
        try {
            const raw = localStorage.getItem('tycoon_save_es');
            if (!raw) return;
            const data = JSON.parse(raw);
            Object.assign(this.estado, data.estado);
            this.estado.empleados = data.empleados.map(o => {
                const e = new Empleado(o.nombre, this);
                Object.assign(e, o);
                return e;
            });
            this.estado.equipo = this.estado.empleados.length;
            this.log('Partida cargada desde localStorage');
            this.actualizarUI();
        } catch(e){ console.warn('Error cargando guardado', e); }
    }

    // Utilitarios
    rand(a,b){ return Math.floor(a + Math.random()*(b-a+1)); }

    log(text, tipo='info'){
        const el = document.createElement('div'); el.className='event-item';
        el.innerHTML = `<div style="font-size:11px; color:var(--muted)">${this.estado.año}-${String(this.estado.mes).padStart(2,'0')}</div><div>${text}</div>`;
        const container = document.getElementById('eventLog');
        container.insertBefore(el, container.firstChild);
        while (container.children.length > 20) container.removeChild(container.lastChild);
    }
    notificar(titulo, texto){
        const n = document.getElementById('notif');
        n.innerHTML = `<strong>${titulo}</strong><div style="margin-top:6px">${texto}</div>`;
        n.classList.add('show');
        setTimeout(()=> n.classList.remove('show'), 2800);
    }

    comprobarLogros(){
        // Ejemplo simple
        if (this.estado.juegos.length === 1) this.popupLogro('Primer lanzamiento', 'Has publicado tu primer juego');
        if (this.estado.ingresosTotales >= 1000000) this.popupLogro('Millonario', 'Has superado $1,000,000 en ingresos');
    }
    popupLogro(t,desc){
        const a = document.getElementById('ach');
        a.innerHTML = `<div style="font-weight:800">${t}</div><div style="font-size:12px">${desc}</div>`;
        a.classList.add('show');
        setTimeout(()=> a.classList.remove('show'), 3500);
    }
}

/* ===== Clase empleado ===== */
let _EMP_ID = 1;
class Empleado {
    constructor(nombre, juego){
        this.id = _EMP_ID++;
        this.nombre = nombre;
        this.role = null;
        this.coding = this.rand(40,80);
        this.design = this.rand(30,75);
        this.art = this.rand(20,70);
        this.qa = this.rand(30,85);
        this.level = 1;
        this.exp = 0;
        this.productivity = this.rand(90,120);
        this.moral = this.rand(60,90);
        this.salarioMensual = 3000 + Math.floor(Math.random()*2500);
        this.estado = 'idle'; // idle, trabajando
        this.juego = juego;
    }
    rand(a,b){ return Math.floor(a + Math.random()*(b-a+1)); }
}

/* ===== Inicializar juego ===== */
const game = new JuegoTycoon();
game.cargarJuego();

/* Teclas: espacio -> acelerar temporal (reduce tickMs cuando se mantiene) */
let acelerando = false;
document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        if (!acelerando){
            acelerando = true;
            clearInterval(game.tickHandle);
            game.tickHandle = setInterval(()=> game.tick(), Math.max(400, game.config.tickMs/3));
            document.getElementById('autoplayBtn').textContent = 'AUTO: (Acel)';
        }
        e.preventDefault();
    }
});
document.addEventListener('keyup', (e) => {
    if (e.code === 'Space') {
        acelerando = false;
        clearInterval(game.tickHandle);
        game.tickHandle = setInterval(()=> game.tick(), game.config.tickMs);
        document.getElementById('autoplayBtn').textContent = game.estado.autoplay ? 'AUTO: ON' : 'AUTO: OFF';
    }
});

/* Exponer funciones para botones con nombres en español */
game.abrirContratacion = game.abrirContratacion.bind(game);
game.invertirMarketing = game.invertirMarketing.bind(game);
game.entrenarEquipo = game.entrenarEquipo.bind(game);
game.moverOficina = game.moverOficina.bind(game);
game.reiniciarJuego = game.reiniciarJuego.bind(game);
game.contratoRapido = game.contratoRapido.bind(game);
game.iniciarProyecto = game.iniciarProyecto.bind(game);
game.continuarMes = game.continuarMes.bind(game);
game.toggleAutoplay = game.toggleAutoplay.bind(game);
game.abrirPanelEmpleado = game.abrirPanelEmpleado.bind(game);

/* Guardar cada 60s por seguridad */
setInterval(()=> game.autoguardar(), 60000);

</script>
